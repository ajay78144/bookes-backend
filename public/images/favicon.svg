<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1a14"/>
      <stop offset="50%" stop-color="#12100d"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </linearGradient>
    
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="bsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd97d"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#a68422"/>
      <stop offset="100%" stop-color="#745c18"/>
    </linearGradient>

    <!-- Page Fill Subtle Gradient -->
    <linearGradient id="bsPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#ece4d3"/>
    </linearGradient>

    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Luxury Dark Rounded Square with Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bsBg)" stroke="url(#bsGold)" stroke-width="2"/>

  <!-- Inner Soft Inset Accent Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="rgba(212, 175, 55, 0.25)" stroke-width="0.8"/>

  <!-- Elegant Open Book Emblem with Shadow -->
  <g filter="url(#goldGlow)">
    <!-- Back Outer Pages -->
    <path d="M14 20 C18 19 25 21 32 25 C39 21 46 19 50 20 L50 44 C46 43 39 45 32 49 C25 45 18 43 14 44 Z" fill="none" stroke="url(#bsGold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Main Inner Page Left -->
    <path d="M16 23 C20 22 26 23.5 32 27 L32 47 C26 44 20 42.5 16 43.5 Z" fill="url(#bsPage)" stroke="url(#bsGold)" stroke-width="1.2"/>
    
    <!-- Main Inner Page Right -->
    <path d="M48 23 C44 22 38 23.5 32 27 L32 47 C38 44 44 42.5 48 43.5 Z" fill="url(#bsPage)" stroke="url(#bsGold)" stroke-width="1.2"/>

    <!-- Book Center Spine Arc -->
    <path d="M29 48 C31 49.5 33 49.5 35 48" fill="none" stroke="url(#bsGold)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Subtle Golden Bookmark Ribbon -->
    <path d="M32 27 L32 50 L34.5 47.5 L37 50 L37 29.5 Z" fill="#e11d48"/>
    
    <!-- Little Star of Knowledge Top Accent -->
    <path d="M32 10.5 L33.2 13.5 L36.2 14.5 L33.2 15.5 L32 18.5 L30.8 15.5 L27.8 14.5 L30.8 13.5 Z" fill="url(#bsGold)"/>
  </g>
</svg>
