<!DOCTYPE html>
<html lang="en">
<head>
  <title>Users - Admin | BookSaw</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicon -->

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="icomoon/icomoon.css">
  <link rel="stylesheet" href="css/vendor.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/ecommerce.css">
  <link rel="stylesheet" href="css/admin-theme.css">
</head>
<body>

  <!-- Mobile Topbar Header -->
  <div class="adm-mobile-bar">
    <div class="d-flex align-items-center gap-2">
      <div class="brand-logo-badge" style="width:30px;height:30px;border-radius:8px;">
        <img src="images/favicon.svg" alt="BookSaw" style="width:22px;height:22px;">
      </div>
      <div class="brand-text-block">
        <span class="brand-name-title" style="font-size:14px;">Book<span class="highlight">Saw</span></span>
        <span class="brand-name-subtitle" style="font-size:8px;">ADMIN PANEL</span>
      </div>
    </div>
    <button class="adm-mobile-toggle" onclick="document.getElementById('admin-sidebar').classList.toggle('open');document.getElementById('adm-backdrop').classList.toggle('active');">
      <svg class="adm-icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>
  <div class="adm-backdrop" id="adm-backdrop" onclick="document.getElementById('admin-sidebar').classList.remove('open');this.classList.remove('active');"></div>

  <div class="admin-layout">
    <div class="admin-sidebar" id="admin-sidebar">
      <a href="dashboard.html" class="sidebar-brand">
        <div class="brand-logo-badge">
          <img src="images/favicon.svg" alt="BookSaw" class="brand-logo-img">
        </div>
        <div class="brand-text-block">
          <span class="brand-name-title">Book<span class="highlight">Saw</span></span>
          <span class="brand-name-subtitle">ADMIN PANEL</span>
        </div>
      </a>
      
      <div class="sidebar-section-label">Catalog &amp; Sales</div>
      
      <a href="dashboard.html" class="nav-item">
        <svg class="adm-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        <span>Dashboard</span>
      </a>

      <a href="books.html" class="nav-item">
        <svg class="adm-icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Books</span>
      </a>

      <a href="country-pricing.html" class="nav-item">
        <svg class="adm-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <span>Country Pricing</span>
      </a>

      <a href="orders.html" class="nav-item">
        <svg class="adm-icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <span>Orders</span>
      </a>

      <a href="coupons.html" class="nav-item">
        <svg class="adm-icon" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
        <span>Coupons</span>
      </a>

      <a href="blogs.html" class="nav-item">
        <svg class="adm-icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        <span>Blog Posts</span>
      </a>

      <a href="users.html" class="nav-item active">
        <svg class="adm-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Users</span>
      </a>

      <div class="sidebar-section-label">Preferences</div>

      <a href="currency.html" class="nav-item">
        <svg class="adm-icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        <span>Currency Rates</span>
      </a>

      <a href="settings.html" class="nav-item">
        <svg class="adm-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0 2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Site Settings</span>
      </a>

      <div class="sidebar-footer">
        <a href="#" onclick="DB.logout();window.location.href='login.html'" class="btn-logout">
          <svg class="adm-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Logout</span>
        </a>
      </div>
    </div>
    <div class="admin-main">
      <div class="admin-topbar">
        <h1>Users Management</h1>
        <div class="topbar-right">
          <button type="button" class="btn-add" onclick="openAddUserModal()">
            <svg class="adm-icon adm-icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Add New User</span>
          </button>
        </div>
      </div>
      <div class="admin-content">
        <div class="admin-card">
          <div class="admin-card-header">
            <h3>All Users (<span id="users-count">0</span>)</h3>
            <div class="adm-search-box">
              <svg class="adm-icon adm-icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="user-search" placeholder="Search users..." oninput="renderUsers()">
            </div>
          </div>
          <div style="padding:0;">
            <table class="admin-table">
              <thead>
                <tr><th>User</th><th>Email</th><th>Phone</th><th>Role</th><th>Orders</th><th>Joined</th><th>Actions</th></tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add User Modal -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal-box" style="max-width:540px;">
      <div class="modal-header">
        <h3 id="user-modal-title">
          <svg class="adm-icon text-primary" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
          <span>Add New User</span>
        </h3>
        <button type="button" class="modal-close" onclick="closeUserModal()" title="Close dialog" aria-label="Close">
          <svg class="adm-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <form id="user-form" onsubmit="handleSaveUser(event)">
        <div class="modal-body">
          <div class="form-group">
            <label for="u-name">Full Name <span class="required-star">*</span></label>
            <input type="text" id="u-name" required placeholder="e.g. Alex Morgan" autocomplete="off">
          </div>

          <div class="row">
            <div class="col-md-6 col-12">
              <div class="form-group">
                <label for="u-email">Email Address <span class="required-star">*</span></label>
                <input type="email" id="u-email" required placeholder="alex@example.com" autocomplete="off">
              </div>
            </div>
            <div class="col-md-6 col-12">
              <div class="form-group">
                <label for="u-phone">Phone Number</label>
                <input type="tel" id="u-phone" placeholder="+1 (555) 019-2834">
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 col-12">
              <div class="form-group">
                <label for="u-password">Password <span class="required-star">*</span></label>
                <input type="password" id="u-password" required placeholder="••••••••" minlength="4">
              </div>
            </div>
            <div class="col-md-6 col-12">
              <div class="form-group">
                <label for="u-role">Role <span class="required-star">*</span></label>
                <select id="u-role" required>
                  <option value="customer">Customer</option>
                  <option value="admin">Administrator</option>
                </select>
              </div>
            </div>
          </div>

          <div id="user-modal-error" style="display:none;background:#fef2f2;border:1px solid #f87171;color:#991b1b;padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:600;margin-top:10px;"></div>
        </div>

        <div class="modal-footer">
          <button type="button" onclick="closeUserModal()" class="btn-cancel">Cancel</button>
          <button type="submit" class="btn-save">
            <svg class="adm-icon adm-icon-sm" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>Create User</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!DB.isAdmin()) window.location.href = 'login.html';
    if (typeof BSLoader !== 'undefined') BSLoader.init();

    function renderUsers() {
      const search = document.getElementById('user-search').value.toLowerCase();
      let users = DB.getUsers();
      if (search) users = users.filter(u => u.name?.toLowerCase().includes(search) || u.email?.toLowerCase().includes(search));

      document.getElementById('users-count').textContent = users.length;
      const tbody = document.getElementById('users-tbody');

      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:36px;color:#888;">No users found matching search.</td></tr>';
        return;
      }

      const orders = DB.getOrders();
      tbody.innerHTML = users.map(u => {
        const userOrders = orders.filter(o => o.userId === u.id).length;
        const initial = (u.name || 'U').charAt(0).toUpperCase();
        return `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:36px;height:36px;border-radius:50%;background:var(--adm-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0;">${initial}</div>
                <div>
                  <strong>${u.name}</strong>
                </div>
              </div>
            </td>
            <td style="font-size:13px;color:var(--adm-text-muted);">${u.email}</td>
            <td style="font-size:13px;color:var(--adm-text-muted);">${u.phone || '—'}</td>
            <td><span class="status-badge ${u.role === 'admin' ? 'status-delivered' : 'status-processing'}">${u.role}</span></td>
            <td><strong>${userOrders}</strong> order(s)</td>
            <td style="font-size:13px;color:var(--adm-text-muted);">${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—'}</td>
            <td>
              <div class="d-flex gap-1.5 align-items-center">
                ${u.role !== 'admin' 
                  ? `<button type="button" class="btn-icon-action btn-icon-pricing" onclick="makeAdmin(${u.id})" title="Grant Admin Rights" aria-label="Make Admin">
                      <svg class="adm-icon" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5 2 7L12 16.5 5.5 20.5l2-7L2 9h7z"></path></svg>
                     </button>` 
                  : `<span class="badge" style="background:#dcfce7;color:#15803d;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;">Admin</span>`}
                <button type="button" class="btn-icon-action btn-icon-delete" onclick="deleteUser(${u.id})" title="Delete User" aria-label="Delete">
                  <svg class="adm-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    function openAddUserModal() {
      document.getElementById('user-form').reset();
      document.getElementById('user-modal-error').style.display = 'none';
      document.getElementById('user-modal').classList.add('active');
      document.getElementById('u-name').focus();
    }

    function closeUserModal() {
      document.getElementById('user-modal').classList.remove('active');
    }

    document.getElementById('user-modal').addEventListener('click', function(e) {
      if (e.target === this) closeUserModal();
    });

    function handleSaveUser(e) {
      e.preventDefault();
      const name = document.getElementById('u-name').value.trim();
      const email = document.getElementById('u-email').value.trim().toLowerCase();
      const phone = document.getElementById('u-phone').value.trim();
      const password = document.getElementById('u-password').value;
      const role = document.getElementById('u-role').value;
      const errEl = document.getElementById('user-modal-error');

      if (!name || !email || !password) {
        errEl.textContent = 'Please fill all required fields';
        errEl.style.display = 'block';
        return;
      }

      const added = DB.addUser({ name, email, phone, password, role });
      if (!added) {
        errEl.textContent = `A user with email "${email}" already exists!`;
        errEl.style.display = 'block';
        return;
      }

      showToast(`✓ User "${name}" created successfully!`, 'success');
      closeUserModal();
      renderUsers();
    }

    function makeAdmin(id) {
      const users = DB.getUsers();
      const i = users.findIndex(u => u.id === id);
      if (i > -1 && confirm(`Grant admin privileges to "${users[i].name}"?`)) {
        users[i].role = 'admin';
        DB.saveUsers(users);
        renderUsers();
        showToast('✓ User promoted to admin', 'success');
      }
    }

    function deleteUser(id) {
      const users = DB.getUsers();
      const user = users.find(u => u.id === id);
      if (!user) return;
      if (user.email === 'admin@booksaw.com') {
        showToast('Default super admin cannot be deleted', 'warning');
        return;
      }
      if (confirm(`Delete user "${user.name}"?`)) {
        DB.saveUsers(users.filter(u => u.id !== id));
        renderUsers();
        showToast('User deleted', 'info');
      }
    }

    renderUsers();
  </script>
</body>
</html>
