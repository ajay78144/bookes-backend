<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - BookSaw</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, #1e293b 0%, #0f172a 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #334155;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #c5a992, #cd7c5e, #c5a992);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-header img {
      max-height: 48px;
      margin-bottom: 14px;
    }
    .badge-admin {
      display: inline-block;
      background: #f1f5f9;
      color: #0f172a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .brand-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .brand-header p {
      font-size: 13.5px;
      color: #64748b;
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-group-custom {
      position: relative;
      margin-bottom: 18px;
    }
    .input-group-custom input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      font-size: 14px;
      color: #0f172a;
      transition: all 0.2s ease;
      background: #f8fafc;
      font-family: inherit;
    }
    .input-group-custom input:focus {
      outline: none;
      border-color: #cd7c5e;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(205, 124, 94, 0.15);
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #94a3b8;
      pointer-events: none;
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #cd7c5e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(205, 124, 94, 0.35);
    }
    .btn-submit:hover {
      background: #b56c50;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(205, 124, 94, 0.45);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .demo-credentials-card {
      margin-top: 24px;
      padding: 14px 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px dashed #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .demo-info {
      font-size: 12px;
      color: #475569;
      line-height: 1.4;
    }
    .demo-info strong {
      color: #0f172a;
      display: block;
      font-size: 12.5px;
      margin-bottom: 2px;
    }
    .btn-demo-fill {
      background: #e2e8f0;
      border: none;
      color: #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-demo-fill:hover {
      background: #cbd5e1;
      color: #000;
    }
    .error-alert {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      font-size: 13px;
      margin-bottom: 16px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
    .login-footer a {
      color: #94a3b8;
      text-decoration: none;
    }
    .login-footer a:hover {
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <img src="images/main-logo.png" alt="BookSaw" onerror="this.style.display='none'">
        <div><span class="badge-admin">Admin Portal</span></div>
        <h2>Welcome Back</h2>
        <p>Sign in to manage books, orders &amp; settings</p>
      </div>

      <div id="error-alert" class="error-alert"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label" for="login-email">Admin Email</label>
          <div class="input-group-custom">
            <span class="input-icon">✉️</span>
            <input type="email" id="login-email" placeholder="admin@booksaw.com" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <label class="form-label" for="login-password">Password</label>
          </div>
          <div class="input-group-custom">
            <span class="input-icon">🔒</span>
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-login">
          <span>Sign In to Dashboard</span> →
        </button>
      </form>

      <div class="demo-credentials-card">
        <div class="demo-info">
          <strong>Default Admin Credentials</strong>
          admin@booksaw.com &bull; admin123
        </div>
        <button type="button" class="btn-demo-fill" onclick="fillDemo()">⚡ Auto Fill</button>
      </div>
    </div>

    <div class="login-footer">
      BookSaw Administration System &bull; Standalone Edition
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Auto redirect if already logged in as admin
    if (typeof DB !== 'undefined' && DB.isAdmin() && (typeof API === 'undefined' || API.getToken())) {
      window.location.href = 'dashboard.html';
    }

    function fillDemo() {
      document.getElementById('login-email').value = 'admin@booksaw.com';
      document.getElementById('login-password').value = 'admin123';
      showError('');
    }

    function showError(msg) {
      const el = document.getElementById('error-alert');
      if (!msg) {
        el.style.display = 'none';
        el.textContent = '';
      } else {
        el.style.display = 'block';
        el.textContent = msg;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      showError('');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showError('Please fill in both email and password.');
        return;
      }

      const btn = document.getElementById('btn-login');
      btn.innerHTML = '<span>Verifying Credentials...</span> ⏳';
      btn.style.opacity = '0.8';
      btn.disabled = true;

      // First attempt backend REST API login
      try {
        if (typeof API !== 'undefined') {
          const res = await API.login(email, password);
          if (res && res.token && res.user) {
            if (res.user.role !== 'admin') {
              btn.disabled = false;
              btn.innerHTML = '<span>Log In to Dashboard</span> <span>&rarr;</span>';
              btn.style.opacity = '1';
              showError('Access Denied: This account does not have administrator privileges.');
              return;
            }
            // Token and user stored by API.login
            window.location.href = 'dashboard.html';
            return;
          } else if (res && res.message && !res.success) {
            // Check fallback for local seed
          }
        }
      } catch (apiErr) {
        console.warn('Backend login error, attempting offline DB check:', apiErr);
      }

      // Check DB users fallback
      let user = DB.findUser(email, password);

      if (!user && email.toLowerCase() === 'admin@booksaw.com' && password === 'admin123') {
        user = { name: 'Admin', email: 'admin@booksaw.com', role: 'admin' };
        DB.addUser(user);
      }

      if (!user) {
        btn.disabled = false;
        btn.innerHTML = '<span>Log In to Dashboard</span> <span>&rarr;</span>';
        btn.style.opacity = '1';
        showError('Invalid email or password. Please try again.');
        return;
      }

      if (user.role !== 'admin') {
        btn.disabled = false;
        btn.innerHTML = '<span>Log In to Dashboard</span> <span>&rarr;</span>';
        btn.style.opacity = '1';
        showError('Access Denied: This account does not have administrator privileges.');
        return;
      }

      DB.setCurrentUser(user);
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 300);
    }
  </script>
</body>
</html>
